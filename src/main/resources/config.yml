database:
  host: "localhost"
  port: "3306"
  user: "root"
  password: ""
  database_name: "book_descriptions"
tags:
  arcrot:
    namespace: "arcrot"
    type: "int"
  charged_arcrot:
    namespace: "charged_arcrot"
    type: "int"
  fictis:
    namespace: "fictis"
    type: "int"
traits:
  test:
    type: "base"
    traittype: "Weapon"
    item: DIRT
    name: "Test"
    description: "Description"
  # DO NOT REMOVE THE CHARGES TRAIT. IT IS USED FOR CHARGES AND IT IS PART OF THE BASE PLUGIN FUNCTIONALITY
  charges:
    type: "printable"
    traittype: "Magic"
    item: REDSTONE
    name: "Charges"
    description: "This item has a series of charges that can be used in order to make the item do something. Some items can regain charges under certain conditions, listed in their lore"
    printable: "<#9C7D2C>[<#E1BD32>Charges: <#E1BD32>$1/$2<#9C7D2C>]"
    weight: 0
    valuetags:
      - charges
      - max_charges
  # Item HP is part of the base plugin too. When this trait is missing, the plugin uses
  # this bundled one. Its weight of -1 draws the HP line right after the charges line.
  item_hp:
    type: "printable"
    traittype: "Magic"
    item: RED_DYE
    name: "Item HP"
    description: "This item has hit points. It loses them as it takes damage, and only staff can restore them"
    printable: "<#9C2C2C>[<#E13232>HP: <#E13232>$1/$2<#9C2C2C>]"
    weight: -1
    valuetags:
      - item_hp
      - max_item_hp
  spell:
    type: "rename"
    traittype: "Magic"
    item: DIAMOND
    name: "Spell"
    description: "This is an item meant to represent a spell in Skysong's system"
    tag: "<gray>[<gold>Spell<gray>]"