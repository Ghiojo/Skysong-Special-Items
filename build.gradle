plugins {
    id 'java'
}

group = 'org.skysongdev'
version = '1.8.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.github.BreweryTeam:TheBrewingProject:v2.8.2'
    // Downloaded by the server at startup through the `libraries` list in plugin.yml.
    compileOnly 'com.zaxxer:HikariCP:6.3.0'

    // Tests run on JUnit 6, the version MockBukkit 4.116.3 is built with. That release
    // is built against Paper 1.21.11, so its mock server matches the API the plugin
    // compiles against. MockBukkit no longer brings the Paper API itself, so the tests
    // declare it.
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    // The server provides these at runtime: HikariCP through plugin.yml, the MySQL driver bundled with Paper.
    testImplementation 'com.zaxxer:HikariCP:6.3.0'
    testRuntimeOnly 'com.mysql:mysql-connector-j:9.1.0'
    // In-memory database in MySQL mode, to run the book queries without a MySQL server.
    testImplementation 'com.h2database:h2:2.3.232'
}

// LuckPerms is kept off the main test classpath so those tests run the plugin as a
// server without LuckPerms would (see WithoutSoftDependenciesTest). The LuckPerms
// integration is tested in this separate suite, which has the LuckPerms API.
testing {
    suites {
        luckPermsTest(JvmTestSuite) {
            useJUnitJupiter('6.0.3')
            dependencies {
                implementation project()
                implementation 'net.luckperms:api:5.4'
                implementation 'org.mockito:mockito-core:5.14.2'
                runtimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
            }
            targets {
                all {
                    testTask.configure {
                        testLogging {
                            events 'failed'
                            exceptionFormat 'full'
                        }
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn(testing.suites.luckPermsTest)
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
