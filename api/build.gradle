// The public API of SkysongItems: the only classes other plugins should compile against.
// JitPack publishes this module from a git tag as
// com.github.Ghiojo.Skysong-Special-Items:api:<tag> (see jitpack.yml).
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.skysongdev'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    compileOnly 'org.jetbrains:annotations:26.0.2'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // JitPack builds the javadoc jar, so a missing @param or similar must not fail a release.
    options.addBooleanOption('Xdoclint:none', true)
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'api'
            from components.java
            // JitPack only serves what the build installs as com.github.<user>:<module>:<tag>.
            // With a custom install command it does not pass the group and tag in, so they
            // are read from the environment variables JitPack sets for every build.
            if (System.getenv('JITPACK')) {
                groupId = System.getenv('GROUP')
                version = System.getenv('VERSION')
            }
        }
    }
}
